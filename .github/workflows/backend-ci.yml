name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/database-migrate.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/database-migrate.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: runam_test
          POSTGRES_USER: runam
          POSTGRES_PASSWORD: runam_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/RunAm.sln

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.0

      - name: Build
        run: dotnet build backend/RunAm.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/RunAm.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=runam_test;Username=runam;Password=runam_test_password"

      - name: Validate migration model and full lifecycle
        env:
          DATABASE_URL: "Host=localhost;Port=5432;Database=runam_test;Username=runam;Password=runam_test_password;SSL Mode=Disable"
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/RunAm.Infrastructure \
            --startup-project backend/src/RunAm.Api \
            --no-build \
            --configuration Release
          dotnet ef database update \
            --project backend/src/RunAm.Infrastructure \
            --startup-project backend/src/RunAm.Api \
            --no-build \
            --configuration Release
          dotnet ef database update 0 \
            --project backend/src/RunAm.Infrastructure \
            --startup-project backend/src/RunAm.Api \
            --no-build \
            --configuration Release
          dotnet ef database update \
            --project backend/src/RunAm.Infrastructure \
            --startup-project backend/src/RunAm.Api \
            --no-build \
            --configuration Release
          ADMIN_SEED_ENABLED=true \
          ADMIN_SEED_EMAIL=ci-admin@runam.test \
          ADMIN_SEED_PASSWORD='CI-Admin-Password-123' \
          dotnet run --project backend/src/RunAm.Api \
            --no-build \
            --configuration Release \
            -- --seed-admin
          ADMIN_SEED_ENABLED=true \
          ADMIN_SEED_EMAIL=ci-admin@runam.test \
          ADMIN_SEED_PASSWORD='CI-Admin-Password-123' \
          dotnet run --project backend/src/RunAm.Api \
            --no-build \
            --configuration Release \
            -- --seed-admin
          mkdir -p artifacts
          dotnet ef migrations script --idempotent \
            --project backend/src/RunAm.Infrastructure \
            --startup-project backend/src/RunAm.Api \
            --no-build \
            --configuration Release \
            --output artifacts/runam-migrations.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: runam-migrations
          path: artifacts/runam-migrations.sql

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
